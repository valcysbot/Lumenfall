# Configuration Nakama commune au serveur de test et au vrai serveur.
# Les secrets arrivent par variables d'environnement (voir .env.example).
name: lumenfall
data_dir: /nakama/data
logger:
  level: INFO
  stdout: true
session:
  token_expiry_sec: 604800   # 7 jours avant de devoir se reconnecter
runtime:
  path: /nakama/data/modules
console:
  port: 7351
