name: Diagnostic de connexion (temporaire)

on:
  push:
    branches: [claude/project-thread-1eh0mk]
    paths: [".github/workflows/diagnostic-connexion.yml"]

jobs:
  diag:
    runs-on: windows-latest
    env:
      GODOT_VERSION: 4.7.2
      HOST: ${{ vars.LF_SERVER_HOST }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Chaîne du certificat
        run: |
          echo | openssl s_client -connect "$HOST:443" -servername "$HOST" -showcerts 2>/dev/null | grep -E "^ *[0-9] s:|i:|NotAfter|Verify" || true
          echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | openssl x509 -noout -dates -issuer
      - name: DNS
        run: nslookup "$HOST" || true
      - name: Godot fait la requête
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip
          echo '' | base64 -d > t.gd
          timeout 90 ./Godot_v${GODOT_VERSION}-stable_win64_console.exe --headless --script t.gd 2>&1 | tail -20
